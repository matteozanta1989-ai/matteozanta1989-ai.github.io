name: Pubblica regalo

on:
  push:
    paths:
      - 'regalo.zip'

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Estrai il regalo
        run: |
          unzip -o regalo.zip
          touch .nojekyll

      - name: Pubblica i file estratti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git commit -m "Pubblica regalo digitale"
          git push
